<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="100%" height="100%">
  <style>
    :root {
      --bg-fill: transparent;
      --icon-color: #21242B;
      --title-color: #21242B;
      --subtitle-color: #4B5563;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg-fill: #1F2127;
        --icon-color: #F89DB5;
        --title-color: #F89DB5;
        --subtitle-color: #E5E7EB;
      }
    }
    .logo-bg { fill: var(--bg-fill); }
    .logo-icon { stroke: var(--icon-color); fill: none; }
    .logo-arrow { fill: var(--icon-color); }
    .logo-title { fill: var(--title-color); }
    .logo-subtitle { fill: var(--subtitle-color); }
  </style>

  <rect class="logo-bg" width="320" height="320" rx="16" />

  <!-- Top Icon Mark -->
  <g transform="translate(48, 16) scale(0.88)">
    <circle class="logo-icon" cx="128" cy="124" r="58" stroke-width="15" />
    <path class="logo-icon" d="M 58 176 L 104 110 L 146 152 L 192 86" stroke-width="15" stroke-linecap="butt" stroke-linejoin="miter" stroke-miterlimit="3" />
    <polygon class="logo-arrow" points="218,60 178,72 206,100" />
  </g>

  <!-- Brand Typography -->
  <text
    class="logo-title"
    x="160"
    y="246"
    text-anchor="middle"
    font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Plus Jakarta Sans', sans-serif"
    font-size="34"
    font-weight="800"
    letter-spacing="2.5"
  >AKIRAQU</text>

  <text
    class="logo-subtitle"
    x="160"
    y="276"
    text-anchor="middle"
    font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
    font-size="12.5"
    font-weight="500"
    letter-spacing="0.2"
  >Analytic Quantitative Crypto Tools</text>
</svg>
