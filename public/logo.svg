<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="100%" height="100%">
  <defs>
    <!-- Premium Cyber Cyan to Electric Blue Gradient -->
    <linearGradient id="akiraCyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>

    <!-- Metallic Silver to White Gradient -->
    <linearGradient id="akiraSilverGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="45%" stop-color="#E2E8F0" />
      <stop offset="100%" stop-color="#94A3B8" />
    </linearGradient>

    <!-- Quantum Energy Core Gradient -->
    <linearGradient id="akiraCoreGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="50%" stop-color="#22D3EE" />
      <stop offset="100%" stop-color="#A5F3FC" />
    </linearGradient>

    <!-- Subtle Cyber Glow Filter -->
    <filter id="akiraGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#06B6D4" flood-opacity="0.45" />
    </filter>

    <filter id="coreBloom" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Deep Obsidian Rounded Squircle Canvas for Universal Tab & App Contrast -->
  <rect width="256" height="256" rx="56" fill="#090D16" stroke="#1E293B" stroke-width="3" />

  <!-- Background Quantum Grid & Concentric Orbital Ticks -->
  <g opacity="0.2">
    <circle cx="128" cy="128" r="92" fill="none" stroke="#38BDF8" stroke-width="1.5" stroke-dasharray="4 8" />
    <circle cx="128" cy="128" r="110" fill="none" stroke="#94A3B8" stroke-width="1" stroke-dasharray="2 12" />
  </g>

  <!-- Main AKIRA.QU Monogram (Geometric 'A' + Quantum 'Q' Orbit + Quantum Dot) -->
  <g filter="url(#akiraGlow)">
    
    <!-- Outer Precision Circuit Accents & Nodes -->
    <!-- Top Apex Node -->
    <circle cx="128" cy="38" r="4" fill="#38BDF8" />
    <line x1="128" y1="38" x2="128" y2="52" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round" />

    <!-- Left Lateral Data Rail -->
    <path d="M 38 128 L 56 128 L 68 140" fill="none" stroke="url(#akiraCyanGrad)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="36" cy="128" r="3" fill="#38BDF8" />

    <!-- Right Lateral Data Rail -->
    <path d="M 218 128 L 200 128 L 188 116" fill="none" stroke="url(#akiraCyanGrad)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="220" cy="128" r="3" fill="#38BDF8" />

    <!-- Quantum Orbit Ring (The 'Q' loop enclosing the core) -->
    <ellipse
      cx="128"
      cy="134"
      rx="64"
      ry="36"
      transform="rotate(-24 128 134)"
      fill="none"
      stroke="url(#akiraCyanGrad)"
      stroke-width="6.5"
      stroke-linecap="round"
      stroke-dasharray="280"
      stroke-dashoffset="15"
    />

    <!-- Diagonal 'Q' Quantum Trajectory Beam shooting to bottom-right -->
    <path
      d="M 166 154 L 198 196 L 214 196"
      fill="none"
      stroke="url(#akiraCoreGrad)"
      stroke-width="6.5"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
    <circle cx="216" cy="196" r="4.5" fill="#38BDF8" />

    <!-- The Primary Iconic 'A' Structure (Sharp Architectural Vault) -->
    <!-- Left Apex Wing -->
    <path
      d="M 128 54 L 64 196 L 86 196 L 128 98 L 146 142"
      fill="none"
      stroke="url(#akiraSilverGrad)"
      stroke-width="8"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

    <!-- Right Apex Wing & Terminal -->
    <path
      d="M 128 54 L 192 196 L 170 196 L 140 126"
      fill="none"
      stroke="url(#akiraSilverGrad)"
      stroke-width="8"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

    <!-- Central Precision Quantum Crossbar / Inverted Core Chevron -->
    <path
      d="M 92 142 L 128 126 L 164 142"
      fill="none"
      stroke="url(#akiraCoreGrad)"
      stroke-width="6"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

    <!-- Central Quantum Core Particle / The '.' in AKIRA.QU -->
    <circle cx="128" cy="106" r="7" fill="url(#akiraCoreGrad)" filter="url(#coreBloom)" />
    <circle cx="128" cy="106" r="3.5" fill="#FFFFFF" />

    <!-- Quantum Base Stabilizers -->
    <line x1="60" y1="206" x2="88" y2="206" stroke="#38BDF8" stroke-width="3" stroke-linecap="round" />
    <line x1="168" y1="206" x2="196" y2="206" stroke="#38BDF8" stroke-width="3" stroke-linecap="round" />
  </g>
</svg>
