<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="100%" height="100%">
  <style>
    :root {
      --bg-color: #F8B4C8;
      --fg-color: #21242B;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg-color: #1F2127;
        --fg-color: #F89DB5;
      }
    }
    .squircle-bg {
      fill: var(--bg-color);
    }
    .trend-symbol {
      stroke: var(--fg-color);
      fill: none;
    }
    .trend-arrow {
      fill: var(--fg-color);
    }
  </style>

  <!-- Squircle Canvas (Responsive Light: Pink, Dark: Charcoal) -->
  <rect class="squircle-bg" width="256" height="256" rx="58" />

  <!-- Circle Symbol -->
  <circle
    class="trend-symbol"
    cx="128"
    cy="124"
    r="58"
    stroke-width="15"
  />

  <!-- Zig-Zag Trend Line -->
  <path
    class="trend-symbol"
    d="M 58 176 L 104 110 L 146 152 L 192 86"
    stroke-width="15"
    stroke-linecap="butt"
    stroke-linejoin="miter"
    stroke-miterlimit="3"
  />

  <!-- Arrowhead (Centered at 45 degrees, flat back perpendicular to shaft) -->
  <polygon
    class="trend-arrow"
    points="218,60 178,72 206,100"
  />
</svg>
