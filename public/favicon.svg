<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="100%" height="100%">
  <defs>
    <!-- Premium Cyber Cyan to Electric Blue Gradient -->
    <linearGradient id="favAkiraCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>

    <!-- Metallic Silver to White Gradient -->
    <linearGradient id="favAkiraSilver" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="45%" stop-color="#E2E8F0" />
      <stop offset="100%" stop-color="#94A3B8" />
    </linearGradient>

    <!-- Quantum Energy Core Gradient -->
    <linearGradient id="favAkiraCore" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="50%" stop-color="#22D3EE" />
      <stop offset="100%" stop-color="#A5F3FC" />
    </linearGradient>

    <!-- Subtle Cyber Glow Filter -->
    <filter id="favGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#06B6D4" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Deep Obsidian Rounded Squircle Canvas for High Contrast in Browser Tabs -->
  <rect width="256" height="256" rx="56" fill="#090D16" stroke="#1E293B" stroke-width="3" />

  <!-- Main AKIRA.QU Monogram (Geometric 'A' + Quantum 'Q' Orbit + Quantum Dot) -->
  <g filter="url(#favGlow)">
    <!-- Quantum Orbit Ring (The 'Q' loop enclosing the core) -->
    <ellipse
      cx="128"
      cy="134"
      rx="66"
      ry="38"
      transform="rotate(-24 128 134)"
      fill="none"
      stroke="url(#favAkiraCyan)"
      stroke-width="10"
      stroke-linecap="round"
    />

    <!-- Diagonal 'Q' Quantum Trajectory Beam shooting to bottom-right -->
    <path
      d="M 166 154 L 202 200 L 222 200"
      fill="none"
      stroke="url(#favAkiraCore)"
      stroke-width="10"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
    <circle cx="222" cy="200" r="6" fill="#38BDF8" />

    <!-- The Primary Iconic 'A' Structure -->
    <path
      d="M 128 48 L 60 200"
      fill="none"
      stroke="url(#favAkiraSilver)"
      stroke-width="12"
      stroke-linecap="round"
    />
    <path
      d="M 128 48 L 196 200"
      fill="none"
      stroke="url(#favAkiraSilver)"
      stroke-width="12"
      stroke-linecap="round"
    />

    <!-- Central Precision Quantum Crossbar -->
    <path
      d="M 88 142 L 128 126 L 168 142"
      fill="none"
      stroke="url(#favAkiraCore)"
      stroke-width="9"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

    <!-- Central Quantum Core Particle / The '.' in AKIRA.QU -->
    <circle cx="128" cy="104" r="9" fill="url(#favAkiraCore)" />
    <circle cx="128" cy="104" r="4.5" fill="#FFFFFF" />
  </g>
</svg>
